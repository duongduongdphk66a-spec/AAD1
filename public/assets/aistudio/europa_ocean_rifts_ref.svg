<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <!-- Deep Jovian space background -->
  <rect width="320" height="220" fill="#110e20" />
  <!-- 3D Geological Cutaway Block of Europa -->
  <!-- 1. Bottom Mantle & Red-Orange Tidal Magma Chamber -->
  <polygon points="78,182 246,178 268,196 78,212" fill="#1c1917" />
  <polygon points="98,206 136,182 176,204" fill="#ea580c" />
  <polygon points="112,205 136,188 158,204" fill="#facc15" />
  <!-- 2. Subsurface Turquoise-Cyan Liquid Ocean -->
  <polygon points="62,86 238,84 246,180 78,182" fill="#0891b2" />
  <polygon points="238,84 268,66 274,162 246,180" fill="#0e7490" />
  <!-- Hydrothermal Seafloor Vents & 2 White-Cyan Rising Plumes -->
  <polygon points="84,182 118,154 152,180 184,158 232,180" fill="#475569" />
  <ellipse cx="116" cy="134" rx="16" ry="22" fill="#99f6e4" opacity="0.82" />
  <ellipse cx="154" cy="138" rx="12" ry="20" fill="#ccfbf1" opacity="0.75" />
  <!-- 3. White Ice Shell Crust & Vertical Fracture Conduit -->
  <polygon points="56,64 132,62 132,86 62,86" fill="#e2e8f0" />
  <polygon points="142,62 238,62 238,84 142,86" fill="#cbd5e1" />
  <rect x="131" y="54" width="11" height="36" fill="#06b6d4" />
  <!-- 4. Golden-Ochre & Reddish-Salt Chaos Terrain Top Surface -->
  <polygon points="56,64 108,42 268,40 238,62" fill="#f59e0b" />
  <polygon points="108,42 152,42 136,64" fill="#fef3c7" />
  <line x1="136" y1="64" x2="156" y2="42" stroke="#1e293b" stroke-width="3" />
  <!-- 5. Erupting Space Cryo-Geyser Spray Plume -->
  <polygon points="132,58 98,8 172,8 142,58" fill="#bae6fd" opacity="0.72" />
  <polygon points="134,58 116,14 156,14 140,58" fill="#ffffff" opacity="0.9" />
  <!-- Green highlight frame from reference diagram -->
  <rect x="68" y="44" width="158" height="56" fill="none" stroke="#84cc16" stroke-width="2.5" />
</svg>
