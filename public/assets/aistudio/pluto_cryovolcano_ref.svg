<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="plutoSpace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="65%" stop-color="#334155" />
      <stop offset="100%" stop-color="#9a6b5c" />
    </linearGradient>
    <radialGradient id="plutoSun" cx="0.82" cy="0.32" r="0.12">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Starry Pluto sky & distant bright sun -->
